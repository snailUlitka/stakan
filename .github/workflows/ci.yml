name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head branch (not the merge commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward to latest remote
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git fetch origin ${{ github.head_ref || github.ref_name }}
          git checkout ${{ github.head_ref || github.ref_name }}
          git pull --ff-only origin ${{ github.head_ref || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies from uv.lock
        run: uv sync --all-groups --locked

      - name: Lint & auto-fix with Ruff
        run: uvx ruff check --fix

      - name: Format imports & code with Ruff Formatter
        run: uvx ruff format

      - name: Commit fixes (if any)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: ${{ github.head_ref || github.ref_name }}
          commit_message: "chore: apply ruff fixes and formatting"

      - name: Run unit tests
        run: uv run --locked pytest -m unit

# TODO: Add integration tests with Ollama, etc.
# use `uv run --locked pytest -m integration`
